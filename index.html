<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《紫水晶骑士物语》任务与条件图谱原型</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

  <!-- 1. 顶部全局导航栏 -->
  <header class="top-header">
    <div class="brand-section">
      <div class="brand-logo">🔮</div>
      <div class="brand-title">紫水晶骑士物语 · 任务与条件依赖图谱</div>
      <div class="breadcrumb">🏰 初始城堡 (Castle)</div>
    </div>

    <!-- 核心模式切换器 -->
    <div class="mode-switcher">
      <button id="modePlayBtn" class="mode-btn active">
        <span>🎮</span> Play 模式 (交互试玩)
      </button>
      <button id="modeEditBtn" class="mode-btn">
        <span>🛠</span> 编辑模式 (增删改节点)
      </button>
    </div>

    <div class="header-actions">
      <!-- 撤销 / 重做 -->
      <button id="btnUndo" class="btn-icon" title="撤销 (Ctrl+Z)"><span>↺</span></button>
      <button id="btnRedo" class="btn-icon" title="重做 (Ctrl+Y)"><span>↻</span></button>

      <!-- 快捷添加节点（主图模式与子图模式切换） -->
      <div id="mainGraphTools" style="display: flex; gap: 6px; align-items: center;">
        <button id="btnAddEventHeader" class="btn-icon btn-draggable-node" title="【拖拽创建】鼠标左键按住拖入画布任意位置放置，或直接点击新建">
          <span>+💬</span> Event
        </button>
        <button id="btnAddConditionHeader" class="btn-icon btn-draggable-node" title="【拖拽创建】鼠标左键按住拖入画布任意位置放置，或直接点击新建 Condition 条件节点">
          <span>+🔍</span> Condition
        </button>
        <button id="btnAddVarHeader" class="btn-icon" title="注册新状态变量 (人物 / 道具 / 传送点 / 成就)">
          <span>+✨</span> 变量 (Var)
        </button>
      </div>

      <div id="subGraphTools" style="display: none; gap: 6px; align-items: center;">
        <button id="btnAddActionHeader" class="btn-icon btn-draggable-node" title="【拖拽创建】按住拖入画布放置，或点击新建复合动作节点">
          <span>+🎬</span> Action
        </button>
        <button id="btnAddSelectorHeader" class="btn-icon btn-draggable-node" title="【拖拽创建】按住拖入画布放置，或点击新建条件分支节点">
          <span>+🔀</span> Selector
        </button>
        <button id="btnAddChoiceHeader" class="btn-icon btn-draggable-node" title="【拖拽创建】按住拖入画布放置，或点击新建玩家选项节点">
          <span>+💬</span> Choice
        </button>
      </div>

      <!-- 预设与状态控制 -->
      <select id="presetSelect" class="preset-select" title="快速切换测试预设"></select>
      <button id="btnResetLayout" class="btn-icon" title="将所有节点恢复为默认无重叠排布">
        <span>📐</span> 恢复默认布局
      </button>
      <button id="btnResetState" class="btn-icon" title="重置为初始状态">
        <span>🔄</span> 重置初始态
      </button>

      <!-- 自动保存状态指示灯 -->
      <span id="saveStatusBadge" class="save-status-badge saved" title="自动同步至 data/castle.json">● 已保存</span>
    </div>
  </header>

  <!-- 2. 主体工作区 (三栏布局: 左状态 | 中画布 | 右详情) -->
  <main class="main-container">
    <!-- 左边栏：「当前队伍与主角状态」面板（由 StateSidebar 动态渲染，日志区与控制区分离） -->
    <aside id="leftSidebar" class="left-sidebar"></aside>

    <!-- 可拖拽左栏分割条 (学习自 64px-portrait-studio) -->
    <div class="column-splitter" id="splitter-left" title="拖动调整左栏宽度">
      <div class="splitter-handle"></div>
    </div>

    <!-- 中央图谱画布视图 (精简节点 + SVG 贝塞尔连线) -->
    <div id="graphViewport" class="graph-viewport">
      <!-- 实体独立聚焦图谱顶栏浮标 (点击道具/成就/实体时显示) -->
      <div id="focalBanner" class="focal-banner hidden">
        <button id="btnBackToMain" class="back-main-btn" title="返回全局大图 (快捷键: Esc)">
          <span class="btn-arrow">←</span> 返回全局大图
        </button>
        <div class="focal-info">
          <span class="focal-tag">围绕实体独立图谱</span>
          <span id="focalTitle" class="focal-title">📘 拥有：冒险书 (book)</span>
          <span id="focalStatusPill" class="focal-status-pill status-pill">● 状态</span>
        </div>
        <div class="focal-meta">
          <span id="focalSourcesCount">📥 1个来源</span>
          <span id="focalTargetsCount">📤 1个后续触发</span>
          <span class="kbd-hint">ESC 退出</span>
        </div>
      </div>

      <!-- Action Tree 子图导航顶栏浮标 -->
      <div id="subGraphBanner" class="focal-banner sub-graph-banner hidden">
        <button id="btnBackFromSubGraph" class="back-main-btn" title="返回全局大图 (快捷键: Esc)">
          <span class="btn-arrow">←</span> 返回全局大图
        </button>
        <div class="focal-info">
          <span class="focal-tag" style="background: rgba(168, 85, 247, 0.2); color: #c084fc; border-color: rgba(168, 85, 247, 0.4);">Action Tree 内部子图</span>
          <span id="subGraphTitle" class="focal-title">⚔️ 事件名称</span>
          <span id="subGraphNodesCount" class="focal-status-pill status-pill status-blue">● 0 个节点</span>
        </div>
        <div class="focal-meta" style="display: flex; align-items: center; gap: 10px;">
          <button id="btnLayoutSubGraph" class="mini-btn-action" style="font-size: 12px; padding: 4px 10px; background: rgba(168, 85, 247, 0.25); border: 1px solid rgba(168, 85, 247, 0.6); color: #e9d5ff; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px;" title="将内部节点自动排列为清晰美观的流程图布局 (防止重叠)">
            <span>📐</span> 整理流程图布局
          </button>
          <button id="btnPlayCurrentSubGraph" class="mini-btn-action" style="font-size: 12px; padding: 4px 10px; background: #10b981; border: none; color: #fff; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <span>▶</span> 立即试玩此事件
          </button>
          <span class="kbd-hint">ESC 退出</span>
        </div>
      </div>

      <div id="graphCanvas" class="graph-canvas">
        <!-- SVG 动态连线层 -->
        <svg id="svgEdges" class="svg-layer"></svg>
        <!-- 连线标签层 -->
        <div id="edgeLabelsContainer" class="edge-label-container"></div>
        <!-- 节点层 -->
        <div id="nodesContainer" class="nodes-layer"></div>
      </div>
    </div>

    <!-- 可拖拽右栏分割条 (学习自 64px-portrait-studio) -->
    <div class="column-splitter" id="splitter-right" title="拖动调整右栏宽度">
      <div class="splitter-handle"></div>
    </div>

    <!-- 右边栏：「节点与 ActionSequence 详细面板」 -->
    <aside id="rightSidebar" class="right-sidebar">
      <div class="panel-header">
        <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px;">
          📋 节点详情与 ActionSequence
        </div>
      </div>
      <div id="inspectorContent" class="inspector-scroll-container">
        <!-- 动态注入选中节点的 ActionSequence 分支、前置条件、后续影响及执行按钮 -->
      </div>
    </aside>
  </main>

  <!-- 3. RPG 对话弹窗 / 剧情交互层 -->
  <div id="dialogOverlay" class="dialog-overlay">
    <div class="rpg-dialog-box">
      <div class="dialog-header">
        <div id="dialogAvatar" class="dialog-avatar">💬</div>
        <div>
          <div id="dialogSpeakerName" class="dialog-speaker-name">说话人</div>
          <div id="dialogSpeakerTitle" class="dialog-speaker-title">身份头衔</div>
        </div>
      </div>
      <div id="dialogBody" class="dialog-body">对话台词文本内容</div>
      <div id="dialogFooter" class="dialog-footer">
        <!-- 动态生成选项或确认按钮 -->
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
